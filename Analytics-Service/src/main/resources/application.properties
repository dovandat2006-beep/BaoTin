spring.application.name=Analytics-Service
server.port=${SERVER_PORT:8189}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/baotin}
spring.datasource.username=${DB_USER:baotin_analytics}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=${DB_MIGRATION_ENABLED:true}
spring.flyway.schemas=analytics
spring.flyway.default-schema=analytics
spring.flyway.create-schemas=${DB_CREATE_SCHEMA:true}

analytics.security.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
analytics.security.issuer=${JWT_ISSUER:baotin-auth}
analytics.security.audience=${JWT_AUDIENCE:baotin-api}
analytics.report-uri=${ANALYTICS_REPORT_URI:http://localhost:8183}
analytics.threat-uri=${ANALYTICS_THREAT_URI:http://localhost:8182}
analytics.upstream-timeout-ms=${ANALYTICS_UPSTREAM_TIMEOUT_MS:3000}

analytics.events.enabled=${ANALYTICS_EVENTS_ENABLED:false}
analytics.events.scan-topic=${SCAN_EVENTS_TOPIC:baotin.scan.events.v1}
analytics.events.report-topic=${REPORT_EVENTS_TOPIC:baotin.report.events.v1}
analytics.events.reputation-topic=${REPUTATION_EVENTS_TOPIC:baotin.reputation.events.v1}
analytics.events.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
analytics.events.sasl-mechanism=${KAFKA_SASL_MECHANISM:}
analytics.events.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${ANALYTICS_KAFKA_GROUP:analytics-service-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.max.poll.records=50
spring.kafka.consumer.properties.max.partition.fetch.bytes=1048576
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.main.banner-mode=off
