spring.datasource.url=jdbc:h2:mem:analytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.schemas=analytics
spring.flyway.default-schema=analytics
spring.flyway.create-schemas=true
analytics.security.jwks-uri=http://localhost:9999/.well-known/jwks.json
analytics.security.issuer=baotin-auth
analytics.security.audience=baotin-api
analytics.report-uri=http://127.0.0.1:1
analytics.threat-uri=http://127.0.0.1:1
analytics.upstream-timeout-ms=1000
