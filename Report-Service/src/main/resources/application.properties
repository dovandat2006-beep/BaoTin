spring.application.name=Report-Service
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.main.banner-mode=off
spring.datasource.url=${REPORT_DB_URL:jdbc:postgresql://localhost:5432/baotin}
spring.datasource.username=${REPORT_DB_USER:report_runtime}
spring.datasource.password=${REPORT_DB_PASSWORD:}
spring.flyway.default-schema=report
spring.flyway.schemas=report
spring.flyway.user=${REPORT_MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${REPORT_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-part-count=1
report.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
report.issuer=${JWT_ISSUER:baotin-auth}
report.audience=${JWT_AUDIENCE:baotin-api}
report.threat-uri=${THREAT_SERVICE_URI:http://localhost:8182}
report.internal-token=${REPORT_THREAT_SERVICE_TOKEN:}
report.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
report.minio.access-key=${MINIO_ACCESS_KEY:}
report.minio.secret-key=${MINIO_SECRET_KEY:}
report.minio.bucket=${MINIO_EVIDENCE_BUCKET:baotin-evidence}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
report.events-topic=baotin.report.events.v1
management.endpoint.health.group.readiness.include=readinessState,db
