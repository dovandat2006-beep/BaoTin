spring.application.name=Search-Service
server.port=${SERVER_PORT:8080}
spring.main.banner-mode=off
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${SEARCH_DB_URL:jdbc:postgresql://localhost:5432/baotin}
spring.datasource.username=${SEARCH_DB_USER:baotin_search}
spring.datasource.password=${SEARCH_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=${SEARCH_MIGRATION_ENABLED:false}
spring.flyway.default-schema=search
spring.flyway.schemas=search
spring.flyway.create-schemas=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SEARCH_CONSUMER_GROUP:search-service-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.max.poll.records=50
spring.kafka.consumer.properties.max.partition.fetch.bytes=1048576
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=true
search.events.enabled=${SEARCH_EVENTS_ENABLED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,projection
