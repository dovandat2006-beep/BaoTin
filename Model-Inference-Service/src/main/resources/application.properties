spring.application.name=Model-Inference-Service
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.main.banner-mode=off
model.text-path=${MODEL_TEXT_PATH:}
model.url-path=${MODEL_URL_PATH:}
model.service-token=${MODEL_SERVICE_TOKEN:}
model.threads=${MODEL_THREADS:2}
model.max-concurrency=${MODEL_MAX_CONCURRENCY:2}
model.timeout-ms=${MODEL_TIMEOUT_MS:3000}
management.endpoint.health.group.readiness.include=readinessState,models
management.endpoint.health.group.liveness.include=livenessState
server.forward-headers-strategy=none
server.tomcat.threads.max=16
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=10s
server.max-http-request-header-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
