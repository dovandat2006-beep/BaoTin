plugins {
	id 'java'
	id 'jacoco'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.baotin'
version = '0.0.1-SNAPSHOT'
description = 'BaoTin API-Gateway'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
	// Security patch within Boot 4.1.1's managed Jackson release line.
	set('jackson-bom.version', '3.1.7')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.testcontainers:testcontainers:2.0.5'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '256m'
}

// --- CI quality gate (SonarQube + JaCoCo) -----------------------------------
// Added so Jenkins can analyse the reviewed revision and enforce the server-side
// quality gate. Lane release không chạy test nên phân tích CI không có coverage;
// jacoco giữ lại để máy dev vẫn sinh được report coverage khi cần.
jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

sonar {
	properties {
		property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://sonarqube:9000'
		property 'sonar.projectKey', 'baotin_' + rootProject.name.toLowerCase()
		property 'sonar.projectName', rootProject.name
		property 'sonar.sourceEncoding', 'UTF-8'
		property 'sonar.exclusions', '**/build/**'
	}
}
