spring.datasource.url=jdbc:h2:mem:threat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.default-schema=threat
spring.flyway.schemas=threat
threat.report-service-token=test-internal-service-token-at-least-32-characters
management.endpoint.health.probes.enabled=true
scan.hash-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
scan.model-uri=http://127.0.0.1:1
scan.jwks-uri=http://127.0.0.1:1/jwks
scan.jwt-issuer=baotin-auth
scan.jwt-audience=baotin-api
scan.events-enabled=false
scan.kafka-bootstrap-servers=127.0.0.1:1
spring.jackson.deserialization.fail-on-unknown-properties=true
