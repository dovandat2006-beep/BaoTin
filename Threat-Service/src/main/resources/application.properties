spring.application.name=Threat-Service
threat.report-service-token=${REPORT_THREAT_SERVICE_TOKEN:}
threat.notification-service-token=${NOTIFICATION_THREAT_SERVICE_TOKEN:}
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:${THREAT_DB_URL:jdbc:postgresql://localhost:5432/baotin}}
spring.datasource.username=${DB_USER:${THREAT_DB_USER:baotin_threat}}
spring.datasource.password=${DB_PASSWORD:${THREAT_DB_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=1500
spring.flyway.enabled=${DB_MIGRATION_ENABLED:true}
spring.flyway.default-schema=threat
spring.flyway.schemas=threat
spring.flyway.user=${DB_MIGRATION_USER:${THREAT_MIGRATION_USER:${spring.datasource.username}}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${THREAT_MIGRATION_PASSWORD:${spring.datasource.password}}}
scan.hash-key=${THREAT_HASH_KEY:}
scan.content-key=${THREAT_CONTENT_KEY:}
scan.retain-raw-text=${THREAT_RETAIN_RAW_TEXT:false}
scan.model-uri=${MODEL_INFERENCE_SERVICE_URI:http://localhost:8185}
scan.model-token=${MODEL_SERVICE_TOKEN:}
scan.reputation-uri=${REPUTATION_SERVICE_URI:}
scan.reputation-token=${REPUTATION_SERVICE_TOKEN:}
scan.reputation-auth-mode=${REPUTATION_AUTH_MODE:bearer}
scan.provider-timeout-ms=${SCAN_PROVIDER_TIMEOUT_MS:800}
scan.jwt-issuer=${JWT_ISSUER:baotin-auth}
scan.jwt-audience=${JWT_AUDIENCE:baotin-api}
scan.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
scan.trusted-gateway-cidrs=${THREAT_TRUSTED_GATEWAY_CIDRS:}
scan.guest-limit=${SCAN_GUEST_LIMIT:10}
scan.user-limit=${SCAN_USER_LIMIT:60}
scan.events-enabled=${THREAT_EVENTS_ENABLED:false}
scan.kafka-bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
server.forward-headers-strategy=none
server.tomcat.threads.max=24
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=10s
server.max-http-request-header-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=true
