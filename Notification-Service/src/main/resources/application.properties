spring.application.name=Notification-Service
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8186}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/baotin}
spring.datasource.username=${DB_USER:baotin_notification}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
# Keep retention from starving the push dispatcher and outbox publisher.
spring.task.scheduling.pool.size=2
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.create-schemas=false
spring.flyway.enabled=${DB_MIGRATION_ENABLED:false}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER:baotin_notification}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Liveness must not depend on Postgres/Kafka/FCM. Readiness drains traffic when
# the database is unavailable; Kafka/outbox retries recover asynchronously.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB

notification.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
notification.issuer=${JWT_ISSUER:baotin-auth}
notification.audience=${JWT_AUDIENCE:baotin-api}
notification.allowed-origins=${NOTIFICATION_ALLOWED_ORIGINS:https://localhost:9444}

notification.push.enabled=${NOTIFICATION_PUSH_ENABLED:false}
notification.push.project-id=${FIREBASE_PROJECT_ID:}
notification.push.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
notification.push.interval-ms=${NOTIFICATION_PUSH_INTERVAL_MS:2000}
notification.push.batch-size=${NOTIFICATION_PUSH_BATCH_SIZE:20}

notification.events.enabled=${NOTIFICATION_EVENTS_ENABLED:false}
notification.events.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
notification.events.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
notification.events.sasl-mechanism=${KAFKA_SASL_MECHANISM:}
notification.events.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}
notification.events.group-id=${NOTIFICATION_EVENTS_GROUP_ID:notification-service}
notification.events.reputation-topic=${REPUTATION_EVENTS_TOPIC:baotin.reputation.events.v1}
notification.events.report-topic=${REPORT_EVENTS_TOPIC:baotin.report.events.v1}
notification.events.notification-topic=${NOTIFICATION_EVENTS_TOPIC:baotin.notification.events.v1}
notification.events.poll-ms=${NOTIFICATION_EVENTS_POLL_MS:500}
notification.risk.min-score-delta=${NOTIFICATION_RISK_MIN_SCORE_DELTA:10}
notification.threat-uri=${THREAT_SERVICE_URI:}
notification.threat-token=${NOTIFICATION_THREAT_SERVICE_TOKEN:}

notification.retention.enabled=${NOTIFICATION_RETENTION_ENABLED:true}
notification.retention.cleanup-cron=${NOTIFICATION_RETENTION_CLEANUP_CRON:0 15 3 * * *}
notification.retention.notifications-days=${NOTIFICATION_RETENTION_NOTIFICATIONS_DAYS:180}
notification.retention.delivery-days=${NOTIFICATION_RETENTION_DELIVERY_DAYS:30}
notification.retention.inbox-days=${NOTIFICATION_RETENTION_INBOX_DAYS:30}
notification.retention.outbox-days=${NOTIFICATION_RETENTION_OUTBOX_DAYS:30}
notification.retention.inactive-device-days=${NOTIFICATION_RETENTION_INACTIVE_DEVICE_DAYS:180}
notification.retention.batch-size=${NOTIFICATION_RETENTION_BATCH_SIZE:2000}
notification.retention.max-batches=${NOTIFICATION_RETENTION_MAX_BATCHES:20}
