map $request_id $correlation_id {
  ~^(........)(....)(....)(....)(............)$ $1-$2-$3-$4-$5;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  error_log /dev/null;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { default_type application/json; return 200 '{"status":"UP"}'; }
  location = /downloads/android.json {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control no-store always;
    try_files $uri =404;
  }
  location ~ "^/downloads/baotin-[a-f0-9]{64}\.apk$" {
    types { application/vnd.android.package-archive apk; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Content-Disposition attachment;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~ ^/(internal|actuator)(/|$) { return 404; }
  location ~ "^/api/v1/reports/[0-9a-fA-F-]{36}/evidence$" {
    client_max_body_size 11m;
    include /etc/nginx/baotin-api-proxy.conf;
  }
  location /api/ {
    # Resolve at request time so a standalone frontend container can start without the gateway.
    client_max_body_size 64k;
    include /etc/nginx/baotin-api-proxy.conf;
  }
  location @api_unavailable {
    default_type application/problem+json;
    add_header Cache-Control no-store always;
    add_header X-Correlation-Id $correlation_id always;
    return 503 '{"type":"https://baotin.example/errors/upstream-unavailable","title":"Request rejected","status":503,"code":"UPSTREAM_UNAVAILABLE","correlationId":"$correlation_id"}';
  }
  location / { try_files $uri $uri/ /index.html; }
}
