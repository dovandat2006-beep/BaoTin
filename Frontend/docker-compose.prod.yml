services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    image: ${BAOTIN_FRONTEND_IMAGE:-baotin-frontend:local}
    restart: unless-stopped
    ports:
      - "${BAOTIN_FRONTEND_HOST:-127.0.0.1}:${BAOTIN_FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
