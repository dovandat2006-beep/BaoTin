spring.application.name=Reputation-Service
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8184}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/baotin}
spring.datasource.username=${DB_USER:baotin_reputation}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.schemas=reputation
spring.flyway.default-schema=reputation
spring.flyway.create-schemas=false
spring.flyway.enabled=${DB_MIGRATION_ENABLED:false}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER:baotin_reputation}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=${REPUTATION_CACHE_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB

reputation.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
reputation.issuer=${JWT_ISSUER:baotin-auth}
reputation.audience=${JWT_AUDIENCE:baotin-api}
reputation.threat-read-token=${REPUTATION_THREAT_READ_TOKEN:}

reputation.cache.enabled=${REPUTATION_CACHE_ENABLED:false}
reputation.cache.ttl-seconds=${REPUTATION_CACHE_TTL_SECONDS:300}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

reputation.events.enabled=${REPUTATION_EVENTS_ENABLED:false}
reputation.events.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
reputation.events.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
reputation.events.sasl-mechanism=${KAFKA_SASL_MECHANISM:}
reputation.events.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}
reputation.events.group-id=${REPUTATION_EVENTS_GROUP_ID:reputation-service-v1}
reputation.events.report-topic=${REPORT_EVENTS_TOPIC:baotin.report.events.v1}
reputation.events.threat-topic=${THREAT_EVENTS_TOPIC:baotin.threat.events.v1}
reputation.events.campaign-topic=${CAMPAIGN_EVENTS_TOPIC:baotin.campaign.events.v1}
reputation.events.topic=${REPUTATION_EVENTS_TOPIC:baotin.reputation.events.v1}
reputation.events.poll-ms=${REPUTATION_EVENTS_POLL_MS:500}
reputation.events.outbox-batch-size=${REPUTATION_OUTBOX_BATCH_SIZE:50}
