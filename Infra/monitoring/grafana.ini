[server]
http_addr = 127.0.0.1
http_port = 3000
domain = prometheus.rimiprod.me
root_url = https://prometheus.rimiprod.me/
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[metrics]
# Dashboard is public behind login; do not expose Grafana's unauthenticated metrics.
enabled = false
[security]
admin_user = baotin-admin
disable_gravatar = true
cookie_samesite = strict
cookie_secure = true
[users]
allow_sign_up = false
[auth.anonymous]
enabled = false
[log]
mode = file
level = warn
[plugins]
preinstall_disabled = true
# This dashboard only needs Prometheus; avoid spawning unrelated datasource backends.
disable_plugins = cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
