version: '3.8'

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: baotin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baotin}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ./Infra/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baotin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: baotin-redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.6
    container_name: baotin-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  minio:
    image: minio/minio
    container_name: baotin-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ==========================================
  # MICROSERVICES
  # ==========================================
  auth-service:
    build:
      context: ./Auth-Service
    container_name: baotin-auth-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=auth
      - SPRING_DATASOURCE_USERNAME=baotin_auth
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_AUTH:-pass_auth}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

  threat-service:
    build:
      context: ./Threat-Service
    container_name: baotin-threat-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=threat
      - SPRING_DATASOURCE_USERNAME=baotin_threat
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_THREAT:-pass_threat}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  report-service:
    build:
      context: ./Report-Service
    container_name: baotin-report-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=report
      - SPRING_DATASOURCE_USERNAME=baotin_report
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_REPORT:-pass_report}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  reputation-service:
    build:
      context: ./Reputation-Service
    container_name: baotin-reputation-service
    ports:
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=reputation
      - SPRING_DATASOURCE_USERNAME=baotin_reputation
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_REPUTATION:-pass_reputation}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  model-inference-service:
    build:
      context: ./Model-Inference-Service
    container_name: baotin-model-inference-service
    ports:
      - "8085:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_started

  notification-service:
    build:
      context: ./Notification-Service
    container_name: baotin-notification-service
    ports:
      - "8086:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=notification
      - SPRING_DATASOURCE_USERNAME=baotin_notification
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_NOTIFICATION:-pass_notification}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: ./Search-Service
    container_name: baotin-search-service
    ports:
      - "8087:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=search
      - SPRING_DATASOURCE_USERNAME=baotin_search
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_SEARCH:-pass_search}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  campaign-service:
    build:
      context: ./Campaign-Service
    container_name: baotin-campaign-service
    ports:
      - "8088:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=campaign
      - SPRING_DATASOURCE_USERNAME=baotin_campaign
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_CAMPAIGN:-pass_campaign}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: ./Analytics-Service
    container_name: baotin-analytics-service
    ports:
      - "8089:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baotin}?currentSchema=analytics
      - SPRING_DATASOURCE_USERNAME=baotin_analytics
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_ANALYTICS:-pass_analytics}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./API-Gateway
    container_name: baotin-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - SPRING_REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_started

volumes:
  postgres_data:
  kafka_data:
  minio_data:
