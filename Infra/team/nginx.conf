upstream baotin_gateway { server api-gateway:8080; }
map $request_id $baotin_correlation {
    "~^([0-9a-f]{8})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{12})$" "$1-$2-$3-$4-$5";
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    large_client_header_buffers 2 8k;
    access_log off;
    # Nginx request errors include raw URIs/OAuth codes. Use app correlation + health,
    # not unsanitized request-context logs; master startup diagnostics remain available.
    error_log /dev/null;
    error_page 413 = @request_too_large;
    error_page 502 504 = @upstream_unavailable;
    location @request_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header X-Correlation-Id $baotin_correlation always;
        return 413 '{"type":"https://baotin.example/errors/request-too-large","title":"Request rejected","status":413,"code":"REQUEST_TOO_LARGE","correlationId":"$baotin_correlation"}';
    }
    location @upstream_unavailable {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header X-Correlation-Id $baotin_correlation always;
        add_header Retry-After "5" always;
        return 503 '{"type":"https://baotin.example/errors/upstream-unavailable","title":"Service unavailable","status":503,"code":"UPSTREAM_UNAVAILABLE","correlationId":"$baotin_correlation"}';
    }
    location / {
        proxy_pass http://baotin_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }
}
