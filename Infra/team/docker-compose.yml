name: ${COMPOSE_PROJECT_NAME:-baotin-team}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set pinned PostgreSQL digest}
    environment:
      POSTGRES_DB: baotin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/postgres/password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ${BAOTIN_SECRETS_DIR:?Set external secret directory}/postgres/password:/run/postgres/password:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d baotin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
  redis:
    image: ${REDIS_IMAGE:?Set pinned Redis digest}
    command: [redis-server, /run/redis/redis.conf]
    volumes:
      - ${BAOTIN_SECRETS_DIR}/redis:/run/redis:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/redis/password)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 128m
  migrate:
    image: ${AUTH_IMAGE:?Set pinned Auth digest}
    profiles: [operations]
    entrypoint: [java]
    command: [-Dloader.main=com.baotin.auth.operator.DatabaseMigration, -cp, /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/baotin
      DB_MIGRATION_USER: baotin_auth_migrator
      DB_MIGRATION_PASSWORD_FILE: /run/migration/password
    volumes:
      - ${BAOTIN_SECRETS_DIR}/migration:/run/migration:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 384m
  auth-service:
    image: ${AUTH_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: team
      SPRING_CONFIG_IMPORT: configtree:/run/auth-config/
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/baotin
      DB_USER: baotin_auth
      DB_MIGRATION_ENABLED: "false"
      JWT_PRIVATE_KEY_PATH: /run/auth-keys/private.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-baotin-team-v1}
      JWT_PREVIOUS_PUBLIC_JWKS_PATH: ${JWT_PREVIOUS_PUBLIC_JWKS_PATH:-}
      AUTH_ENCRYPTION_KEY_PATH: /run/auth-keys/encryption.bin
      AUTH_ENCRYPTION_KEY_ID: ${AUTH_ENCRYPTION_KEY_ID:-v1}
      AUTH_LEGACY_ENCRYPTION_KEY_ID: ${AUTH_LEGACY_ENCRYPTION_KEY_ID:-v1}
      AUTH_PREVIOUS_ENCRYPTION_KEYS: ${AUTH_PREVIOUS_ENCRYPTION_KEYS:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set exact Expo origins}
      AUTH_TRUSTED_GATEWAY_CIDRS: 172.29.47.10/32
      FIREBASE_PHONE_ENABLED: "false"
      AUTH_EVENTS_ENABLED: ${AUTH_EVENTS_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
    volumes:
      - ${BAOTIN_SECRETS_DIR}/auth-config:/run/auth-config:ro
      - ${BAOTIN_SECRETS_DIR}/auth-keys:/run/auth-keys:ro
    networks:
      backend: {ipv4_address: 172.29.47.11}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
  api-gateway:
    image: ${GATEWAY_IMAGE:?Set pinned Gateway digest}
    environment:
      SPRING_PROFILES_ACTIVE: team
      SPRING_CONFIG_IMPORT: configtree:/run/gateway-config/
      AUTH_SERVICE_URI: http://auth-service:8080
      AUTH_JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      REDIS_HOST: redis
      GATEWAY_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS}
      GATEWAY_TRUSTED_PROXY_CIDRS: 172.29.47.12/32,172.29.47.1/32,${GATEWAY_HOST_PROXY_IPV6_CIDR:-}
    volumes:
      - ${BAOTIN_SECRETS_DIR}/gateway-config:/run/gateway-config:ro
    networks:
      backend: {ipv4_address: 172.29.47.10}
    depends_on:
      auth-service: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
  ingress:
    image: ${NGINX_IMAGE:?Set pinned ingress digest}
    ports: ["127.0.0.1:${EDGE_PORT:-8090}:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend: {ipv4_address: 172.29.47.12}
    depends_on:
      api-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    read_only: true
    tmpfs: [/tmp]
networks:
  backend:
    ipam:
      config: [{subnet: "${TEAM_SUBNET:-172.29.47.0/24}"}]
volumes:
  pg-data:
