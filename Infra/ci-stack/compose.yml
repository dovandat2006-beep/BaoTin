# Existing installation only: generate the private manifest before first use.
# Never substitute new/empty volumes during adoption. No image upgrades here.
name: baotin-ci
services:
  jenkins:
    image: ${JENKINS_IMAGE:?Private snapshot image required}
    pull_policy: never
    container_name: jenkins-blueocean
    restart: unless-stopped
    mem_limit: 2560m
    memswap_limit: 3g
    env_file:
      - path: ${CI_STATE_DIR:?External state directory required}/jenkins.env
        format: raw
    ports:
      - "${JENKINS_HOST_PORT:-8081}:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - docker-certs:/certs/client:ro
    networks: [jenkins]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --max-time 5 http://127.0.0.1:8080/login >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
  docker:
    image: ${DIND_IMAGE:?Private patched snapshot image required}
    pull_policy: never
    container_name: docker
    privileged: true
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 5g
    env_file:
      - path: ${CI_STATE_DIR}/docker.env
        format: raw
    volumes:
      - docker-certs:/certs
      - docker-data:/var/lib/docker
    networks: [jenkins]
    healthcheck:
      test: [CMD-SHELL, "docker --host=unix:///var/run/docker.sock info >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
  sonar-db:
    image: ${SONAR_DB_IMAGE:?Existing immutable image required}
    pull_policy: never
    container_name: baotin-sonar-db
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    env_file:
      - path: ${CI_STATE_DIR}/sonar-db.env
        format: raw
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks: [sonar]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12
  sonarqube:
    image: ${SONAR_IMAGE:?Existing immutable image required}
    pull_policy: never
    container_name: sonarqube
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 4g
    depends_on:
      sonar-db:
        condition: service_healthy
    env_file:
      - path: ${CI_STATE_DIR}/sonarqube.env
        format: raw
    ports:
      - "${SONAR_BIND_ADDRESS:-0.0.0.0}:9001:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks: [sonar, jenkins]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- --timeout=5 http://127.0.0.1:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 15s
      timeout: 8s
      retries: 24
      start_period: 60s
volumes:
  jenkins-data:
    external: true
    name: ${JENKINS_DATA_VOLUME:?Existing volume required}
  docker-certs:
    external: true
    name: ${DOCKER_CERTS_VOLUME:?Existing volume required}
  docker-data:
    external: true
    name: ${DIND_DATA_VOLUME:?Exact existing anonymous volume required}
  sonar-db-data:
    external: true
    name: ${SONAR_DB_VOLUME:?Existing volume required}
  sonar-data:
    external: true
    name: ${SONAR_DATA_VOLUME:?Existing volume required}
  sonar-extensions:
    external: true
    name: ${SONAR_EXTENSIONS_VOLUME:?Existing volume required}
  sonar-logs:
    external: true
    name: ${SONAR_LOGS_VOLUME:?Existing volume required}
networks:
  jenkins:
    external: true
    name: jenkins
  sonar:
    external: true
    name: baotin-sonar
