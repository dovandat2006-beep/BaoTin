map $request_id $correlation_id {
  ~^(........)(....)(....)(....)(............)$ $1-$2-$3-$4-$5;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  error_log /dev/null;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { default_type application/json; return 200 '{"status":"UP"}'; }
  location ~ ^/(internal|actuator)(/|$) { return 404; }
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 64k;
    proxy_buffering off;
    error_page 502 504 = @api_unavailable;
  }
  location @api_unavailable {
    default_type application/problem+json;
    add_header Cache-Control no-store always;
    add_header X-Correlation-Id $correlation_id always;
    return 503 '{"type":"https://baotin.example/errors/upstream-unavailable","title":"Request rejected","status":503,"code":"UPSTREAM_UNAVAILABLE","correlationId":"$correlation_id"}';
  }
  location / { try_files $uri $uri/ /index.html; }
}
