spring.application.name=Auth-Service
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/baotin}
spring.datasource.username=${DB_USER:baotin_auth}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.flyway.create-schemas=false
spring.flyway.enabled=${DB_MIGRATION_ENABLED:false}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER:baotin_auth}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.localhost=${SMTP_HELO_HOST:auth.baotin.internal}
spring.mail.properties.mail.host=${SMTP_HELO_HOST:auth.baotin.internal}
spring.mail.properties.mail.from=${SMTP_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.issuer=${JWT_ISSUER:baotin-auth}
auth.audience=${JWT_AUDIENCE:baotin-api}
auth.private-key-path=${JWT_PRIVATE_KEY_PATH:}
auth.key-id=${JWT_KEY_ID:}
auth.encryption-key-path=${AUTH_ENCRYPTION_KEY_PATH:}
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:https://localhost:9444}
auth.mail.enabled=${SMTP_ENABLED:false}
management.health.mail.enabled=${auth.mail.enabled:false}
auth.mail.from=${SMTP_FROM:}
auth.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.oauth.google.callback-uri=${GOOGLE_CALLBACK_URI:}
auth.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
auth.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
auth.oauth.facebook.callback-uri=${FACEBOOK_CALLBACK_URI:}
auth.oauth.facebook.graph-uri=${FACEBOOK_GRAPH_URI:https://graph.facebook.com/v25.0}
auth.oauth.facebook.authorization-uri=${FACEBOOK_AUTHORIZATION_URI:https://www.facebook.com/v25.0/dialog/oauth}
auth.oauth.native-return-uris=${OAUTH_NATIVE_RETURN_URIS:baotin://auth/callback}
auth.oauth.web-return-uris=${OAUTH_WEB_RETURN_URIS:https://localhost:9444/auth/callback}
auth.firebase.enabled=${FIREBASE_PHONE_ENABLED:false}
auth.firebase.project-id=${FIREBASE_PROJECT_ID:}
auth.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
auth.firebase.test-phones=${FIREBASE_TEST_PHONES:}
auth.verification-jwks-path=${JWT_PREVIOUS_PUBLIC_JWKS_PATH:}
auth.encryption-key-id=${AUTH_ENCRYPTION_KEY_ID:v1}
auth.legacy-encryption-key-id=${AUTH_LEGACY_ENCRYPTION_KEY_ID:${AUTH_ENCRYPTION_KEY_ID:v1}}
auth.previous-encryption-keys=${AUTH_PREVIOUS_ENCRYPTION_KEYS:}
auth.events.enabled=${AUTH_EVENTS_ENABLED:false}
auth.events.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
auth.events.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
auth.events.sasl-mechanism=${KAFKA_SASL_MECHANISM:}
auth.events.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}
server.max-http-request-header-size=16KB
auth.trusted-gateway-cidrs=${AUTH_TRUSTED_GATEWAY_CIDRS:}
auth.auth-write-limit=${AUTH_WRITE_LIMIT:30}
auth.rate-window-seconds=${AUTH_RATE_WINDOW_SECONDS:300}
