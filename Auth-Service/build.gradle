plugins {
	id 'java'
	id 'jacoco'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.baotin'
version = '0.0.1-SNAPSHOT'
description = 'BaoTin Auth-Service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Security patches within Boot 4.1.1's managed release lines; remove when its BOM catches up.
ext['jackson-2-bom.version'] = '2.21.7'
ext['jackson-bom.version'] = '3.1.7'
ext['tomcat.version'] = '11.0.25'

dependencies {
	// CVE-2026-106451: kafka-clients 4.2.1 still brings at.yawk.lz4:lz4-java 1.10.1,
	// and the Boot BOM does not manage that coordinate. Remove once it pins 1.11.4+.
	constraints {
        // Current packaged-JAR HIGH fixes; keep the security gate unchanged.
        implementation 'org.xerial.snappy:snappy-java:1.1.10.9'
        implementation 'com.google.guava:guava:33.7.2-jre'

		implementation 'at.yawk.lz4:lz4-java:1.11.4'
	}

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
	implementation 'com.google.firebase:firebase-admin:9.11.0'
	implementation 'org.apache.kafka:kafka-clients'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.testcontainers:postgresql:1.21.3'
	testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
	testImplementation 'org.testcontainers:testcontainers-kafka:2.0.5'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '256m'
}

tasks.register('adminOperator', JavaExec) {
	group = 'operations'
	description = 'Operator-only ADMIN lifecycle; never runs during normal application startup'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.baotin.auth.operator.AdminOperator'
}

tasks.register('rewrapSecrets', JavaExec) {
	group = 'operations'
	description = 'Offline migrator-only AES-GCM key rotation; never an HTTP operation'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.baotin.auth.operator.RewrapSecrets'
}

tasks.register('migrateDatabase', JavaExec) {
	group = 'operations'
	description = 'Isolated migrator job; never requires provisioning/superuser credentials'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.baotin.auth.operator.DatabaseMigration'
}

tasks.register('deliveryOperator', JavaExec) {
	group = 'operations'
	description = 'Operator-only audited exhausted delivery requeue'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.baotin.auth.operator.DeliveryOperator'
}

// --- CI quality gate (SonarQube + JaCoCo) -----------------------------------
// Added so Jenkins can analyse the reviewed revision and enforce the server-side
// quality gate. Lane release không chạy test nên phân tích CI không có coverage;
// jacoco giữ lại để máy dev vẫn sinh được report coverage khi cần.
jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

sonar {
	properties {
		property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://sonarqube:9000'
		property 'sonar.projectKey', 'baotin_' + rootProject.name.toLowerCase()
		property 'sonar.projectName', rootProject.name
		property 'sonar.sourceEncoding', 'UTF-8'
		property 'sonar.exclusions', '**/build/**'
	}
}
