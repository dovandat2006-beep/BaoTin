{
  "openapi": "3.1.0",
  "info": {
    "title": "BaoTin Auth API",
    "version": "0.1.0",
    "description": "BaoTin password/JWT/TOTP/session API with separate native bearer and Web cookie transports. Additional full-plan work is tracked in Auth-Service/IMPLEMENTATION_STATUS.md.",
    "license": {
      "name": "Proprietary",
      "url": "https://baotin.example/license"
    }
  },
  "servers": [
    {
      "url": "https://{gatewayHost}:9443",
      "variables": {
        "gatewayHost": {
          "default": "baotin.tailnet.ts.net",
          "description": "Replace with the verified tailnet hostname before deployment"
        }
      }
    }
  ],
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
    "/api/v1/auth/register": {
      "post": {
        "operationId": "post_register",
        "summary": "register",
        "security": [],
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Profile"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Invalid authentication",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "Internal failure; no diagnostic details exposed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "413": {
            "$ref": "#/components/responses/IngressPayloadTooLarge"
          },
          "503": {
            "$ref": "#/components/responses/UpstreamUnavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "username",
                  "password",
                  "displayName"
                ],
                "properties": {
                  "username": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 30,
                    "pattern": "^[a-zA-Z0-9._]{3,30}$"
                  },
                  "email": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "minLength": 1,
                    "maxLength": 320,
                    "format": "email"
                  },
                  "password": {
                    "type": "string",
                    "minLength": 12,
                    "maxLength": 128
                  },
                  "displayName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128
                  },
                  "phone": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "pattern": "^\\+[1-9][0-9]{7,14}$",
                    "description": "Configured fictional Firebase dev number only; disabled on team/prod"
                  }
                },
                "anyOf": [
                  {
                    "required": [
                      "email"
                    ],
                    "properties": {
                      "email": {
                        "type": "string",
                        "minLength": 3
                      }
                    }
                  },
                  {
                    "required": [
                      "phone"
                    ],
                    "properties": {
                      "phone": {
                        "type": "string",
                        "minLength": 9
                      }
                    }
                  }
                ]
              }
            }
          }
        },
        "description": "register. Exact role/ownership and MFA rules are described in Contracts/docs/auth-flows.md."
      }
    },
