openapi: 3.1.0
info:
  title: BaoTin Reputation Service internal API
  version: 0.1.0
  description: Internal risk/reputation API for ThreatTarget. These routes are never published through the public Gateway.
    The service validates Auth-issued access JWTs. A separate private service credential permits only target reads.
  license:
    name: Proprietary
    url: https://baotin.example/license
servers:
- url: http://reputation-service:8080
  description: Private container network only; no host or Gateway route is exposed by this contract
security:
- BearerAuth: []
paths:
  /internal/v1/reputation/targets/{threatTargetId}:
    get:
      operationId: getReputation
      summary: Read the current reputation of a ThreatTarget
      description: ADMIN or MODERATOR JWT, or a private read-only service key required. Internal only. A missing target returns 404 instead of inventing a score. Mixed or duplicate credentials are rejected.
      security:
      - BearerAuth: []
      - ThreatReadKey: []
      parameters:
      - name: threatTargetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current reputation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reputation'
        '401':
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Target has never been calculated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/reputation/targets/{threatTargetId}/recalculate:
    post:
      operationId: recalculateReputation
      summary: Recalculate a ThreatTarget reputation
      description: ADMIN required. Recalculates from stored signals. Operator-supplied signal/count overrides are accepted
        for backfill and demos; a target that does not exist yet requires targetType. The normal event-driven path uses report.verified/rejected/revoked,
        threat.updated and campaign.updated instead.
      parameters:
      - name: threatTargetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculationRequest'
      responses:
        '200':
          description: Recalculated reputation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reputation'
        '400':
          description: Invalid target type, signal or count
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Target type conflict or concurrent update
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    ThreatReadKey:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Separate 256-bit private Threat read key (64 lowercase hex characters). Disabled when not configured. Grants only this GET; never recalculate or administrative access. Must not be combined with Authorization or repeated.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth-issued access token. Must have typ=at+jwt, token_use=access, the configured issuer/audience and a
        roles claim.
  schemas:
    TargetType:
      type: string
      enum:
      - URL
      - PHONE
      - BANK_ACCOUNT
      - EMAIL
      - OTHER
    RiskLevel:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      description: LOW 0-24, MEDIUM 25-49, HIGH 50-74, CRITICAL 75-100.
    Signals:
      type: object
      additionalProperties: false
      properties:
        reportSignal:
          type: number
          format: double
          minimum: 0
          maximum: 100
        ruleSignal:
          type: number
          format: double
          minimum: 0
          maximum: 100
        aiSignal:
          type: number
          format: double
          minimum: 0
          maximum: 100
        campaignSignal:
          type: number
          format: double
          minimum: 0
          maximum: 100
    RecalculationRequest:
      type: object
      additionalProperties: false
      properties:
        targetType:
          $ref: '#/components/schemas/TargetType'
        signals:
          $ref: '#/components/schemas/Signals'
        totalReportCount:
          type: integer
          minimum: 0
        verifiedReportCount:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 200
    Reputation:
      type: object
      additionalProperties: false
      required:
      - threatTargetId
      - targetType
      - reportSignal
      - ruleSignal
      - aiSignal
      - campaignSignal
      - finalScore
      - riskLevel
      - confidence
      - totalReportCount
      - verifiedReportCount
      - calculationVersion
      - calculatedAt
      - version
      properties:
        threatTargetId:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/TargetType'
        reportSignal:
          type: number
          minimum: 0
          maximum: 100
        ruleSignal:
          type: number
          minimum: 0
          maximum: 100
        aiSignal:
          type: number
          minimum: 0
          maximum: 100
        campaignSignal:
          type: number
          minimum: 0
          maximum: 100
        finalScore:
          type: number
          minimum: 0
          maximum: 100
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        totalReportCount:
          type: integer
          minimum: 0
        verifiedReportCount:
          type: integer
          minimum: 0
        calculationVersion:
          type: string
          maxLength: 30
        calculatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    Problem:
      type: object
      description: RFC 9457-style flat error body. Custom fields stay top-level.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri
        correlationId:
          type: string
          format: uuid
