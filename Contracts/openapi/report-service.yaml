  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "CreateReport": {
        "type": "object",
        "required": [
          "targetType",
          "targetValue",
          "category",
          "title",
          "description"
        ],
        "properties": {
          "targetType": {
            "type": "string",
            "enum": [
              "URL",
              "MESSAGE_TEMPLATE"
            ]
          },
          "targetValue": {
            "type": "string",
            "minLength": 1,
            "maxLength": 10000
          },
          "category": {
            "type": "string",
            "enum": [
              "SUSPICIOUS_MESSAGE",
              "PHISHING_URL",
              "SPAM",
              "OTHER"
            ]
          },
          "title": {
            "type": "string",
            "minLength": 6,
            "maxLength": 200
          },
          "description": {
            "type": "string",
            "minLength": 16,
            "maxLength": 10000
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          },
          "scanId": {
            "type": "string",
            "format": "uuid",
            "description": "Optional source scan. Threat must authorize it for the authenticated reporter and verify matching type/input. Foreign or deleted scans return 404; mismatches return 400. Omit for manual reports."
          }
        }
      },
      "Decision": {
        "type": "object",
        "required": [
          "version",
          "note"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "note": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      },
      "Evidence": {
        "type": "object",
        "required": [
          "id",
          "originalFilename",
          "mimeType",
          "sizeBytes",
          "sha256",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "originalFilename": {
            "type": "string"
          },
          "mimeType": {
            "type": "string",
            "enum": [
              "image/jpeg",
              "image/png",
              "image/webp",
              "application/pdf"
            ]
          },
          "sizeBytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10485760
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "History": {
        "type": "object",
        "required": [
          "fromStatus",
          "toStatus",
          "changedByUserId",
          "note",
          "createdAt"
        ],
        "properties": {
          "fromStatus": {
            "type": [
              "string",
              "null"
            ]
          },
          "toStatus": {
            "type": "string",
            "enum": [
              "SUBMITTED",
              "PENDING_REVIEW",
              "NEED_MORE_INFO",
              "VERIFIED",
              "REJECTED"
            ]
          },
          "changedByUserId": {
            "type": "string",
            "format": "uuid"
          },
          "note": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Report": {
        "type": "object",
        "required": [
          "id",
          "reporterUserId",
          "threatTargetId",
          "targetTypeSnapshot",
          "targetDisplaySnapshot",
          "category",
          "title",
          "description",
          "occurredAt",
          "status",
          "priority",
          "moderatorNote",
          "createdAt",
          "updatedAt",
          "version",
          "evidence",
          "history"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "reporterUserId": {
            "type": "string",
            "format": "uuid"
          },
          "threatTargetId": {
            "type": "string",
            "format": "uuid"
          },
          "targetTypeSnapshot": {
            "type": "string",
            "enum": [
              "URL",
              "MESSAGE_TEMPLATE"
            ]
          },
          "targetDisplaySnapshot": {
            "type": "string"
          },
          "category": {
            "type": "string",
            "enum": [
              "SUSPICIOUS_MESSAGE",
              "PHISHING_URL",
              "SPAM",
              "OTHER"
            ]
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "occurredAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "SUBMITTED",
              "PENDING_REVIEW",
              "NEED_MORE_INFO",
              "VERIFIED",
              "REJECTED"
            ]
          },
          "priority": {
            "type": "string",
            "enum": [
              "LOW",
              "MEDIUM",
              "HIGH"
            ]
          },
          "moderatorNote": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "evidence": {
            "type": "array",
            "maxItems": 5,
            "items": {
              "$ref": "#/components/schemas/Evidence"
            }
          },
          "history": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/History"
            }
          },
          "scanId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid",
            "description": "Verified source scan ID, when supplied at creation."
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "items",
          "page",
          "size",
          "totalItems",
          "totalPages"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Report"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 0
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "totalItems": {
            "type": "integer",
            "minimum": 0
          },
          "totalPages": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Problem": {
        "type": "object",
        "required": [
          "title",
          "status",
          "code"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "TargetRequest": {
        "type": "object",
        "required": [
          "type",
          "value"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "URL",
              "MESSAGE_TEMPLATE"
            ]
          },
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 10000
          },
          "scanId": {
            "type": "string",
            "format": "uuid"
          },
          "reporterUserId": {
            "type": "string",
            "format": "uuid",
            "description": "Verified Report JWT subject; required together with scanId."
          }
        },
        "dependentRequired": {
          "scanId": [
            "reporterUserId"
          ],
          "reporterUserId": [
            "scanId"
          ]
        }
      },
      "Target": {
        "type": "object",
        "required": [
          "id",
          "type",
          "displayValue"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "type": {
            "type": "string",
            "enum": [
              "URL",
              "MESSAGE_TEMPLATE"
            ]
          },
          "displayValue": {
            "type": "string"
          }
        }
      }
    }
  }
}
